<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Respawn Timer</title>


<style>

*{
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}


body{

margin:0;
min-height:100vh;

background:#111827;

color:white;

display:flex;

justify-content:center;

align-items:center;

padding:15px;

}



.container{

width:100%;

max-width:430px;

background:#1f2937;

padding:25px;

border-radius:25px;

text-align:center;

box-shadow:0 0 30px black;

}



h1{

margin-top:0;

}



/* TIMER CIRCLE */


.circle{

width:260px;

height:260px;

margin:20px auto;

border-radius:50%;

display:flex;

justify-content:center;

align-items:center;

background:
conic-gradient(
#22c55e 360deg,
#374151 360deg
);

position:relative;

}



.circle::before{

content:"";

position:absolute;

width:210px;

height:210px;

background:#111827;

border-radius:50%;

}



.timer{

position:relative;

z-index:2;

font-size:60px;

font-weight:bold;

}



.warning{

color:red;

}




/* BUTTONS */


button{

border:none;

padding:12px 18px;

margin:5px;

border-radius:12px;

background:#374151;

color:white;

font-size:18px;

cursor:pointer;

touch-action:manipulation;

}



button:active{

transform:scale(.95);

}



.startCircle{

width:150px;

height:150px;

border-radius:50%;

background:#16a34a;

font-size:32px;

font-weight:bold;

box-shadow:0 0 25px #16a34a;

}



.small{

font-size:14px;

padding:8px 14px;

}



.pause{

background:#eab308;

color:black;

}



.reset{

background:#dc2626;

}



.multiplier button{

width:100px;

height:55px;

font-size:24px;

background:#2563eb;

}




input{

width:100px;

padding:10px;

font-size:20px;

text-align:center;

border-radius:10px;

border:none;

}



.toggle{

display:flex;

justify-content:space-between;

align-items:center;

background:#374151;

padding:15px;

margin-top:12px;

border-radius:12px;

}




.switch{

width:55px;

height:28px;

position:relative;

}



.switch input{

display:none;

}



.slider{

position:absolute;

inset:0;

background:#6b7280;

border-radius:20px;

}



.slider:before{

content:"";

position:absolute;

width:24px;

height:24px;

left:2px;

top:2px;

background:white;

border-radius:50%;

transition:.3s;

}



input:checked + .slider{

background:#22c55e;

}



input:checked + .slider:before{

transform:translateX(27px);

}





.timeup{

display:none;

position:fixed;

inset:0;

background:red;

justify-content:center;

align-items:center;

font-size:70px;

font-weight:bold;

z-index:10;

}



.flash{

animation:flash .5s infinite;

}



@keyframes flash{

50%{

background:white;

}

}





@media(max-width:400px){


.circle{

width:220px;

height:220px;

}



.circle::before{

width:175px;

height:175px;

}



.timer{

font-size:48px;

}



.startCircle{

width:130px;

height:130px;

font-size:26px;

}


}



</style>

</head>


<body>


<div class="container">


<h1>Respawn Timer</h1>



<div class="circle" id="circle">


<div id="display" class="timer">

00:30

</div>


</div>




<button class="startCircle" onclick="startTimer()">

START

</button>



<br>


<button class="pause small" onclick="pauseTimer()">

⏸

</button>


<button class="reset small" onclick="resetTimer()">

↻

</button>





<h3>Timer Duration</h3>



<button class="small" onclick="changeTime(-5)">
-5
</button>


<input id="customTime" value="30" type="number">


<button class="small" onclick="changeTime(5)">
+5
</button>





<h3>Multiplier</h3>


<div class="multiplier">


<button onclick="multiStart(2)">
2X
</button>


<button onclick="multiStart(3)">
3X
</button>


</div>






<div class="toggle">


<span>

Five of Time

</span>


<label class="switch">

<input id="fiveTime" type="checkbox">

<span class="slider"></span>

</label>


</div>





<div class="toggle">


<span>

No Respawn Time

</span>


<label class="switch">

<input id="noRespawn" type="checkbox">

<span class="slider"></span>

</label>


</div>




</div>





<div id="timeup" class="timeup">

TIME UP

</div>





<script>


let timer;

let seconds=30;

let totalSeconds=30;

let running=false;

let fiveValue=0;



const display=document.getElementById("display");

const circle=document.getElementById("circle");

const noRespawnToggle=document.getElementById("noRespawn");






function updateDisplay(){


let min=Math.floor(seconds/60);

let sec=seconds%60;


display.innerHTML=

`${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;



let percent=seconds/totalSeconds;



circle.style.background=

`conic-gradient(

#22c55e ${percent*360}deg,

#374151 ${percent*360}deg

)`;



}






function startTimer(){



if(running)
return;



if(document.getElementById("fiveTime").checked){


fiveValue+=5;


if(fiveValue>60){

fiveValue=0;

}


seconds=fiveValue;


}



totalSeconds=seconds;


updateDisplay();



running=true;



timer=setInterval(()=>{


seconds--;


updateDisplay();



if(seconds<=0){

finishTimer();

}



},1000);



}







function multiStart(value){


if(value==2){

seconds=60;

}



if(value==3){

seconds=90;

}



updateDisplay();


startTimer();


}








noRespawnToggle.addEventListener("change",function(){



if(this.checked){



clearInterval(timer);


seconds=45;

totalSeconds=45;


running=false;


startTimer();



}



});









function pauseTimer(){


clearInterval(timer);


running=false;


}








function resetTimer(){



clearInterval(timer);


running=false;



seconds=parseInt(
document.getElementById("customTime").value
);


totalSeconds=seconds;


updateDisplay();



}







function changeTime(amount){



let input=document.getElementById("customTime");


let value=parseInt(input.value)+amount;



if(value<0){

value=0;

}



input.value=value;


seconds=value;


totalSeconds=value;


updateDisplay();



}









function finishTimer(){



clearInterval(timer);


running=false;


seconds=0;


updateDisplay();



document.body.classList.add("flash");


document.getElementById("timeup")
.style.display="flex";





if(noRespawnToggle.checked){


threeBeeps();


noRespawnToggle.checked=false;


}

else{


normalBeep();


}





setTimeout(()=>{


document.getElementById("timeup")
.style.display="none";


document.body.classList.remove("flash");


},3000);



}








function normalBeep(){



let ctx=new AudioContext();


let osc=ctx.createOscillator();


let gain=ctx.createGain();



osc.frequency.value=700;


osc.connect(gain);

gain.connect(ctx.destination);



gain.gain.value=.2;


osc.start();


osc.stop(ctx.currentTime+3);



}







function threeBeeps(){



let ctx=new AudioContext();



for(let i=0;i<3;i++){



let osc=ctx.createOscillator();


let gain=ctx.createGain();



osc.frequency.value=900;



osc.connect(gain);


gain.connect(ctx.destination);



let start=ctx.currentTime+(i*.8);



gain.gain.setValueAtTime(.3,start);


gain.gain.setValueAtTime(0,start+.25);



osc.start(start);


osc.stop(start+.3);



}


}






document.getElementById("customTime")
.addEventListener("change",()=>{


seconds=parseInt(
document.getElementById("customTime").value
);


totalSeconds=seconds;


updateDisplay();


});



updateDisplay();



</script>


</body>

</html>
