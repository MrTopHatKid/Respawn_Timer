<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Respawn Timer & Tarot Cards</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #111827;
    color: white;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px;
    overflow-x: hidden;
}

button {
    border: 0;
    cursor: pointer;
    touch-action: manipulation;
    color: white;
}

button:active {
    transform: scale(.96);
}

/* ================= TIMER ================= */

.container {
    width: 100%;
    max-width: 430px;
    padding: 22px;
    border-radius: 25px;
    background: #1f2937;
    text-align: center;
    box-shadow: 0 0 30px rgba(0,0,0,.65);
}

h1 {
    margin: 0 0 10px;
}

.circle {
    width: 260px;
    height: 260px;
    margin: 20px auto;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: conic-gradient(#22c55e 360deg,#374151 360deg);
}

.circle::before {
    content: "";
    position: absolute;
    width: 210px;
    height: 210px;
    border-radius: 50%;
    background: #111827;
}

.timer {
    position: relative;
    z-index: 2;
    font-size: 60px;
    font-weight: bold;
}

.startFlash {
    animation: startFlash .45s ease-in-out infinite;
}

@keyframes startFlash {
    50% {
        opacity: .25;
    }
}

.startCircle {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: #16a34a;
    font-size: 30px;
    font-weight: bold;
    box-shadow: 0 0 25px rgba(22,163,74,.7);
}

.startCircle:hover {
    box-shadow: 0 0 35px rgba(22,163,74,.95);
}

.small {
    padding: 8px 14px;
    background: #4383cc;
    margin: 5px;
    border-radius: 10px;
    font-size: 14px;
}

.pause {
    background: #eab308;
    color: #111;
}

.reset {
    background: #dc2626;
}

input[type="number"] {
    width: 100px;
    padding: 10px;
    font-size: 20px;
    text-align: center;
    border: 0;
    border-radius: 10px;
}

.multiplier {
    display: flex;
    justify-content: center;
    gap: 12px;
}

.multiplier button {
    width: 115px;
    height: 65px;
    border-radius: 15px;
    background: #2563eb;
    font-size: 25px;
    font-weight: bold;
}

.toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
    padding: 15px;
    border-radius: 12px;
    background: #374151;
}

.switch {
    width: 55px;
    height: 28px;
    position: relative;
}

.switch input {
    display: none;
}

.slider {
    position: absolute;
    inset: 0;
    background: #6b7280;
    border-radius: 20px;
    transition: .25s;
}

.slider:before {
    content: "";
    position: absolute;
    width: 24px;
    height: 24px;
    top: 2px;
    left: 2px;
    background: white;
    border-radius: 50%;
    transition: .3s;
}

.switch input:checked + .slider {
    background: #22c55e;
}

.switch input:checked + .slider:before {
    transform: translateX(27px);
}

/* ================= TIME UP ================= */

.timeup {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
    align-items: center;
    justify-content: center;
    background: red;
    font-size: 70px;
    font-weight: bold;
}

.flash {
    animation: screenFlash .5s infinite;
}

@keyframes screenFlash {
    50% {
        background: #fff;
    }
}

/* ================= TAROT BUTTON ================= */

.tarotButton {
    margin-top: 15px;
    padding: 15px 50px;
    border-radius: 10px;
    background: #27abbd;
}

.tarotButtonPressed {
    animation: tarotButtonPress .55s cubic-bezier(.22,1,.36,1);
}

@keyframes tarotButtonPress {
    0% {
        transform: scale(1);
    }
    35% {
        transform: scale(.9);
    }
    65% {
        transform: scale(1.08);
    }
    100% {
        transform: scale(1);
    }
}

/* ================= TAROT OVERLAY ================= */

.tarotOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 15px;
    background: rgba(0,0,0,.94);
    opacity: 0;
    transform: scale(.98);
    transition:
        opacity .45s cubic-bezier(.22,1,.36,1),
        transform .45s cubic-bezier(.22,1,.36,1);
}

.tarotOverlay.open {
    opacity: 1;
    transform: scale(1);
}

.tarotMenu {
    width: 100%;
    max-width: 900px;
    max-height: 92vh;
    overflow-y: auto;
    position: relative;
    padding: 25px;
    border-radius: 20px;
    background: #1f2937;
    text-align: center;
    box-shadow: 0 0 40px rgba(0,0,0,.8);
    opacity: 0;
    transform: translateY(15px) scale(.98);
    transition:
        opacity .45s cubic-bezier(.22,1,.36,1),
        transform .5s cubic-bezier(.22,1,.36,1);
}

.tarotOverlay.open .tarotMenu {
    opacity: 1;
    transform: translateY(0) scale(1);
}

.tarotMenu h2 {
    margin: 5px 0;
    font-size: 30px;
}

.tarotSubtitle {
    color: #9ca3af;
    margin-top: 5px;
}

.closeTarot {
    position: absolute;
    right: 12px;
    top: 12px;
    width: 40px;
    height: 40px;
    padding: 0;
    margin: 0;
    border-radius: 50%;
    background: #374151;
    font-size: 18px;
}

/* ================= TAROT CARDS ================= */

.tarotCards {
    min-height: 350px;
    margin-top: 25px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    perspective: 1400px;
    position: relative;
}

.tarotCard {
    width: 220px;
    height: 330px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    border: 3px solid rgba(255,255,255,.35);
    background: linear-gradient(135deg,#374151,#111827);
    cursor: pointer;

    transform-style: preserve-3d;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    will-change: transform, opacity, box-shadow, border-color;

    transition:
        transform .75s cubic-bezier(.22,1,.36,1),
        opacity .55s ease,
        box-shadow 2.8s ease-in-out,
        border-color 2.8s ease-in-out;
}

.tarotCard::before {
    content: "✦";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 120px;
    color: rgba(255,255,255,.05);
    pointer-events: none;
}

.tarotCard::after {
    content: "";
    position: absolute;
    inset: -50%;
    background: radial-gradient(
        circle,
        rgba(255,255,255,.08),
        transparent 55%
    );
    pointer-events: none;
}

/* ================= CARD ENTRANCE ================= */

.cardEntering {
    opacity: 0;
    transform: translateY(25px) scale(.94);
}

.cardEntered {
    opacity: 1;
    transform: translateY(0) scale(1);
}

/* ================= RANDOM GLOW ================= */

.randomGlow {
    transition:
        box-shadow 3.4s ease-in-out,
        border-color 3.4s ease-in-out;
}

/* ================= CARD BACK ================= */

.cardBack {
    position: absolute;
    inset: 0;
    z-index: 2;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.cardBackIcon {
    font-size: 70px;
    margin-bottom: 15px;
}

.cardBackText {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 2px;
}

.cardBackSubtext {
    margin-top: 8px;
    color: #9ca3af;
    font-size: 12px;
}

/* ================= OTHER CARDS ================= */

.disappearing {
    opacity: 0 !important;
    transform: scale(.8) translateY(15px) !important;
    pointer-events: none;
}

/* ================= REVEALED CARD ================= */

.revealedBackground {
    position: absolute;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    border-radius: 15px;
}

.revealedBackground::before {
    content: "";
    position: absolute;
    width: 220%;
    height: 220%;
    left: -60%;
    top: -60%;

    background:
        conic-gradient(
            from 0deg,
            transparent 0deg,
            rgba(255,255,255,.16) 35deg,
            transparent 75deg,
            transparent 140deg,
            rgba(255,255,255,.12) 180deg,
            transparent 220deg,
            transparent 290deg,
            rgba(255,255,255,.16) 325deg,
            transparent 360deg
        );

    animation: orbitGlow 9s linear infinite;
    will-change: transform;
}

@keyframes orbitGlow {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

.revealedBackground::after {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 12px;
    box-shadow: inset 0 0 35px rgba(255,255,255,.08);
}

/* ================= UNIQUE CARD FRONT ================= */

.revealedContent {
    position: absolute;
    inset: 0;
    z-index: 5;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 25px;

    opacity: 0;
    transform: scale(.86) translateY(10px);

    transition:
        opacity .55s cubic-bezier(.22,1,.36,1),
        transform .7s cubic-bezier(.22,1,.36,1);
}

.showRevealed .revealedContent {
    opacity: 1;
    transform: scale(1) translateY(0);
}

.revealedIcon {
    width: 75px;
    height: 75px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 14px;
    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.2),
            rgba(255,255,255,.03) 70%
        );

    border: 1px solid rgba(255,255,255,.3);

    font-size: 40px;

    animation: iconPulse 2s ease-in-out infinite alternate;
}

@keyframes iconPulse {
    from {
        transform: scale(.97);
    }

    to {
        transform: scale(1.05);
    }
}

.cardRarity {
    margin-bottom: 12px;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.cardName {
    font-size: 23px;
    font-weight: bold;
    line-height: 1.15;
    text-align: center;
}

/* ================= RARITY GLOWS ================= */

.tarotCard.mythic {
    border-color: #fff4a3 !important;

    box-shadow:
        0 0 8px #fff4a3,
        0 0 20px #fff4a3,
        0 0 40px #fff4a3,
        0 0 75px rgba(255,244,163,.7),
        inset 0 0 30px rgba(255,244,163,.18);
}

.tarotCard.legendary {
    border-color: #ffad66 !important;

    box-shadow:
        0 0 8px #ffad66,
        0 0 20px #ffad66,
        0 0 40px #ffad66,
        0 0 75px rgba(255,173,102,.7),
        inset 0 0 30px rgba(255,173,102,.18);
}

.tarotCard.epic {
    border-color: #c084fc !important;

    box-shadow:
        0 0 8px #c084fc,
        0 0 20px #c084fc,
        0 0 40px #c084fc,
        0 0 75px rgba(192,132,252,.7),
        inset 0 0 30px rgba(192,132,252,.18);
}

.tarotCard.rare {
    border-color: #60a5fa !important;

    box-shadow:
        0 0 8px #60a5fa,
        0 0 20px #60a5fa,
        0 0 40px #60a5fa,
        0 0 75px rgba(96,165,250,.7),
        inset 0 0 30px rgba(96,165,250,.18);
}

.tarotCard.common {
    border-color: #bfc3c7 !important;

    box-shadow:
        0 0 8px #bfc3c7,
        0 0 20px #bfc3c7,
        0 0 40px #bfc3c7,
        0 0 70px rgba(191,195,199,.65),
        inset 0 0 30px rgba(191,195,199,.15);
}

/* ================= ABILITY BELOW CARD ================= */

.selectedAbility {
    display: none;
    margin-top: 25px;
    padding: 20px;

    border-radius: 15px;
    background: #111827;
    text-align: left;

    opacity: 0;
    transform: translateY(18px) scale(.97);

    transition:
        opacity .8s cubic-bezier(.22,1,.36,1),
        transform .8s cubic-bezier(.22,1,.36,1);
}

.selectedAbility.abilityVisible {
    opacity: 1;
    transform: translateY(0) scale(1);
}

.selectedAbility h3 {
    margin-top: 0;
    font-size: 26px;

    opacity: 0;
    transform: translateY(8px);

    transition:
        opacity .55s ease .15s,
        transform .55s cubic-bezier(.22,1,.36,1) .15s;
}

.selectedAbility p {
    opacity: 0;
    transform: translateY(8px);

    transition:
        opacity .65s ease .28s,
        transform .65s cubic-bezier(.22,1,.36,1) .28s;
}

.selectedAbility .selectedRarity {
    opacity: 0;
    transform: translateY(8px) scale(.95);

    transition:
        opacity .55s ease .22s,
        transform .55s cubic-bezier(.22,1,.36,1) .22s;
}

.selectedAbility.abilityVisible h3,
.selectedAbility.abilityVisible p,
.selectedAbility.abilityVisible .selectedRarity {
    opacity: 1;
    transform: translateY(0) scale(1);
}

.selectedRarity {
    display: inline-block;
    padding: 6px 10px;
    margin-bottom: 10px;
    border-radius: 8px;
    color: #111827;
    font-weight: bold;
}

.selectedRarity.mythic {
    background: #fff4a3;
}

.selectedRarity.legendary {
    background: #ffad66;
}

.selectedRarity.epic {
    background: #c084fc;
}

.selectedRarity.rare {
    background: #60a5fa;
}

.selectedRarity.common {
    background: #bfc3c7;
}

.drawAgain {
    display: block;
    margin: 20px auto 0;
    padding: 12px 18px;
    border-radius: 12px;
    background: #2563eb;

    opacity: 0;
    transform: translateY(8px);

    transition:
        opacity .55s ease .42s,
        transform .55s cubic-bezier(.22,1,.36,1) .42s;
}

.selectedAbility.abilityVisible .drawAgain {
    opacity: 1;
    transform: translateY(0);
}

/* ================= MOBILE ================= */

@media(max-width:700px) {

    .tarotCards {
        gap: 10px;
        min-height: 250px;
    }

    .tarotCard {
        width: 30%;
        height: 250px;
    }

    .cardBackIcon {
        font-size: 50px;
    }

    .cardBackText {
        font-size: 13px;
    }
}

@media(max-width:500px) {

    body {
        padding: 8px;
    }

    .container {
        padding: 18px 13px;
    }

    .tarotMenu {
        padding: 18px 9px;
    }

    .tarotCards {
        gap: 7px;
        min-height: 220px;
    }

    .tarotCard {
        width: 31%;
        height: 220px;
        padding: 7px;
    }

    .cardBackIcon {
        font-size: 42px;
    }

    .cardBackText {
        font-size: 11px;
    }

    .cardBackSubtext {
        font-size: 9px;
    }

    .revealedContent {
        padding: 12px;
    }

    .revealedIcon {
        width: 55px;
        height: 55px;
        font-size: 30px;
        margin-bottom: 8px;
    }

    .cardRarity {
        font-size: 11px;
        letter-spacing: 2px;
        margin-bottom: 8px;
    }

    .cardName {
        font-size: 15px;
    }

    .selectedAbility {
        margin-top: 20px;
        padding: 17px;
    }

    .selectedAbility h3 {
        font-size: 22px;
    }
}

@media(max-width:400px) {

    .circle {
        width: 220px;
        height: 220px;
    }

    .circle::before {
        width: 175px;
        height: 175px;
    }

    .timer {
        font-size: 48px;
    }

    .startCircle {
        width: 130px;
        height: 130px;
        font-size: 26px;
    }

    .multiplier button {
        width: 95px;
        height: 55px;
    }

    .tarotCard {
        height: 200px;
    }

    .revealedIcon {
        width: 48px;
        height: 48px;
        font-size: 25px;
    }

    .cardName {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Respawn Timer</h1>

    <div class="circle" id="circle">
        <div class="timer" id="display">00:30</div>
    </div>

    <button class="startCircle" onclick="startTimer()">
        START
    </button>

    <br>

    <button class="pause small" onclick="pauseTimer()">⏸</button>
    <button class="reset small" onclick="resetTimer()">↻</button>

    <h3>Timer Duration</h3>

    <button class="small" onclick="changeTime(-5)">-5</button>

    <input
        id="customTime"
        type="number"
        value="30"
        min="0">

    <button class="small" onclick="changeTime(5)">+5</button>

    <h3>Multiplier</h3>

    <div class="multiplier">
        <button onclick="multiStart(2)">2X</button>
        <button onclick="multiStart(3)">3X</button>
    </div>

    <div class="toggle">
        <span>Five of Time</span>

        <label class="switch">
            <input id="fiveTime" type="checkbox">
            <span class="slider"></span>
        </label>
    </div>

    <div class="toggle">
        <span>No Respawn Time</span>

        <label class="switch">
            <input id="noRespawn" type="checkbox">
            <span class="slider"></span>
        </label>
    </div>

    <button class="tarotButton" onclick="openTarot()">
        🃏 TAROT CARDS
    </button>

</div>

<div id="timeup" class="timeup">
    TIME UP
</div>

<div id="tarotOverlay" class="tarotOverlay">

    <div class="tarotMenu">

        <button class="closeTarot" onclick="closeTarot()">
            ✕
        </button>

        <h2>🃏 Tarot Cards</h2>

        <p class="tarotSubtitle">
            Choose ONE card
        </p>

        <div id="tarotCards" class="tarotCards"></div>

        <div id="selectedAbility" class="selectedAbility"></div>

    </div>

</div>

<script>

/* =========================================================
   TIMER
========================================================= */

let timer = null;
let seconds = 30;
let totalSeconds = 30;
let running = false;
let fiveValue = 0;
let audioContext = null;

const display = document.getElementById("display");
const circle = document.getElementById("circle");
const noRespawnToggle = document.getElementById("noRespawn");
const fiveTimeToggle = document.getElementById("fiveTime");
const customTime = document.getElementById("customTime");


/* =========================================================
   AUDIO
========================================================= */

function enableAudio() {

    try {

        if (!audioContext) {

            audioContext = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

    } catch(e) {
        console.log("Audio unavailable");
    }
}


/* =========================================================
   DISPLAY
========================================================= */

function updateDisplay() {

    const minutes = Math.floor(seconds / 60);
    const secs = seconds % 60;

    display.textContent =
        `${String(minutes).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;

    let percent = 0;

    if (totalSeconds > 0) {
        percent = Math.max(
            0,
            Math.min(1, seconds / totalSeconds)
        );
    }

    circle.style.background =
        `conic-gradient(
            #22c55e ${percent * 360}deg,
            #374151 ${percent * 360}deg
        )`;
}


/* =========================================================
   START
========================================================= */

function startTimer() {

    enableAudio();

    if (running) return;

    if (fiveTimeToggle.checked) {

        fiveValue += 5;

        if (fiveValue > 60) {
            fiveValue = 0;
        }

        seconds = fiveValue;

        if (fiveValue === 0) {

            totalSeconds = 60;

            updateDisplay();

            return;
        }

    } else {

        if (seconds <= 0) {
            seconds = 30;
        }
    }

    totalSeconds = seconds;

    updateDisplay();

    running = true;

    display.classList.remove("startFlash");

    void display.offsetWidth;

    display.classList.add("startFlash");

    setTimeout(() => {

        display.classList.remove("startFlash");

    }, 3000);

    timer = setInterval(() => {

        seconds--;

        updateDisplay();

        if (seconds <= 0) {

            clearInterval(timer);

            timer = null;

            running = false;

            finishTimer();
        }

    }, 1000);
}


/* =========================================================
   MULTIPLIERS
========================================================= */

function multiStart(multiplier) {

    enableAudio();

    clearInterval(timer);

    timer = null;
    running = false;

    fiveTimeToggle.checked = false;

    seconds =
        multiplier === 2
        ? 60
        : 90;

    totalSeconds = seconds;
    customTime.value = seconds;

    updateDisplay();

    startTimer();
}


/* =========================================================
   NO RESPAWN
========================================================= */

noRespawnToggle.addEventListener(
    "change",
    function() {

        if (this.checked) {

            enableAudio();

            clearInterval(timer);

            timer = null;
            running = false;

            seconds = 45;
            totalSeconds = 45;

            customTime.value = 45;

            updateDisplay();

            startTimer();
        }
    }
);


/* =========================================================
   PAUSE
========================================================= */

function pauseTimer() {

    clearInterval(timer);

    timer = null;
    running = false;
}


/* =========================================================
   RESET
========================================================= */

function resetTimer() {

    clearInterval(timer);

    timer = null;
    running = false;

    seconds = 30;
    totalSeconds = 30;

    customTime.value = 30;

    noRespawnToggle.checked = false;

    updateDisplay();
}


/* =========================================================
   TIMER ADJUSTMENT
========================================================= */

function changeTime(amount) {

    clearInterval(timer);

    timer = null;
    running = false;

    let value = parseInt(customTime.value) || 0;

    value += amount;

    if (value < 0) {
        value = 0;
    }

    customTime.value = value;

    seconds = value;
    totalSeconds = value;

    updateDisplay();
}


customTime.addEventListener(
    "change",
    function() {

        clearInterval(timer);

        timer = null;
        running = false;

        let value = parseInt(this.value) || 0;

        if (value < 0) {
            value = 0;
        }

        this.value = value;

        seconds = value;
        totalSeconds = value;

        updateDisplay();
    }
);


/* =========================================================
   TIMER FINISH
========================================================= */

function finishTimer() {

    clearInterval(timer);

    timer = null;
    running = false;

    seconds = 0;

    updateDisplay();

    document.body.classList.add("flash");

    document.getElementById("timeup").style.display = "flex";

    if (noRespawnToggle.checked) {

        threeBeeps();

        noRespawnToggle.checked = false;

    } else {

        normalBeep();
    }

    setTimeout(() => {

        document.getElementById("timeup").style.display = "none";

        document.body.classList.remove("flash");

        seconds = 30;
        totalSeconds = 30;

        customTime.value = 30;

        updateDisplay();

    },3000);
}


/* =========================================================
   NORMAL SOUND
========================================================= */

function normalBeep() {

    enableAudio();

    if (!audioContext) return;

    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.type = "sine";
    osc.frequency.value = 700;

    osc.connect(gain);
    gain.connect(audioContext.destination);

    const now = audioContext.currentTime;

    gain.gain.setValueAtTime(.25,now);

    gain.gain.exponentialRampToValueAtTime(
        .01,
        now + 1.2
    );

    osc.start(now);
    osc.stop(now + 1.2);
}


/* =========================================================
   THREE BEEPS
========================================================= */

function threeBeeps() {

    enableAudio();

    if (!audioContext) return;

    for (let i = 0; i < 3; i++) {

        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        const start =
            audioContext.currentTime +
            i * .55;

        osc.type = "square";
        osc.frequency.value = 900;

        osc.connect(gain);
        gain.connect(audioContext.destination);

        gain.gain.setValueAtTime(.3,start);
        gain.gain.setValueAtTime(0,start + .25);

        osc.start(start);
        osc.stop(start + .3);
    }
}

/* =========================================================
   RARITY CHANCES
   =========================================================
   
   CHANGE THESE PERCENTAGES ONLY.
   
   TOTAL MUST EQUAL 100.
   
   Current chances:
   
   Mythic     = 1%
   Legendary = 5%
   Epic      = 14%
   Rare      = 25%
   Common    = 55%
   
========================================================= */

const RARITY_CHANCES = {

    mythic: 2,
    legendary: 5,
    epic: 14,
    rare: 24,
    common: 55

};


/* =========================================================
   RANDOM GLOW COLORS
========================================================= */

const glowColors = [
    "#ff6b81",
    "#ff9f43",
    "#ffd166",
    "#4dd4ac",
    "#4dabf7",
    "#748ffc",
    "#b197fc",
    "#f783ac",
    "#ffffff"
];


/* =========================================================
   RANDOM ABILITY BY RARITY
========================================================= */

function getRandomAbility() {

    /* =====================================================
       ROLL FOR RARITY
    ===================================================== */

    let random =
        Math.random() * 100;

    let selectedRarity = null;

    for (const rarity in RARITY_CHANCES) {

        random -= RARITY_CHANCES[rarity];

        if (random <= 0) {

            selectedRarity = rarity;

            break;
        }
    }


    /* =====================================================
       SAFETY FALLBACK
    ===================================================== */

    if (!selectedRarity) {

        selectedRarity = "common";

    }


    /* =====================================================
       GET ABILITIES FROM SELECTED RARITY
    ===================================================== */

    const matchingAbilities =
        tarotAbilities.filter(
            ability =>
                ability.className === selectedRarity
        );


    /* =====================================================
       RANDOM ABILITY FROM SELECTED RARITY
       
       Every ability within the selected rarity
       has an equal chance.
    ===================================================== */

    if (matchingAbilities.length > 0) {

        return matchingAbilities[
            Math.floor(
                Math.random() *
                matchingAbilities.length
            )
        ];

    }


    /* =====================================================
       FINAL FALLBACK
    ===================================================== */

    return tarotAbilities[
        Math.floor(
            Math.random() *
            tarotAbilities.length
        )
    ];
}


/* =========================================================
   RANDOM CARD GLOW
========================================================= */

function animateRandomGlow(card) {

    if (
        card.dataset.selected === "true" ||
        card.dataset.disappearing === "true"
    ) {
        return;
    }

    const color =
        glowColors[
            Math.floor(
                Math.random() * glowColors.length
            )
        ];

    card.style.borderColor = color;

    card.style.boxShadow =
        `0 0 7px ${color},
         0 0 16px ${color},
         0 0 28px rgba(255,255,255,.08)`;

    setTimeout(
        () => animateRandomGlow(card),
        3200 + Math.random() * 1400
    );
}


/* =========================================================
   OPEN TAROT
========================================================= */

function openTarot() {

    const overlay =
        document.getElementById("tarotOverlay");

    const cards =
        document.getElementById("tarotCards");

    const selected =
        document.getElementById("selectedAbility");

    const button =
        document.querySelector(".tarotButton");


    button.classList.remove(
        "tarotButtonPressed"
    );

    void button.offsetWidth;

    button.classList.add(
        "tarotButtonPressed"
    );


    selected.style.display = "none";
    selected.classList.remove("abilityVisible");
    selected.innerHTML = "";

    cards.innerHTML = "";


    for (let i = 0; i < 3; i++) {

        const ability =
            getRandomAbility();

        const card =
            document.createElement("div");

        card.className =
            "tarotCard cardEntering";

        card.dataset.selected = "false";
        card.dataset.disappearing = "false";

        card.ability = ability;

        card.innerHTML = `

            <div class="cardBack">

                <div class="cardBackIcon">
                    🃏
                </div>

                <div class="cardBackText">
                    TAROT
                </div>

                <div class="cardBackSubtext">
                    CHOOSE ME
                </div>

            </div>

        `;


        card.addEventListener(
            "click",
            () => selectTarotCard(
                card,
                ability
            ),
            {once:true}
        );


        cards.appendChild(card);


        setTimeout(() => {

            card.classList.remove(
                "cardEntering"
            );

            card.classList.add(
                "cardEntered"
            );

            animateRandomGlow(card);

        },80 + i * 90);
    }


    overlay.style.display = "flex";

    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            overlay.classList.add("open");

        });

    });
}


/* =========================================================
   SELECT CARD
========================================================= */

function selectTarotCard(card,ability) {

    if (
        card.dataset.selected === "true"
    ) {
        return;
    }

    card.dataset.selected = "true";


    const container =
        document.getElementById("tarotCards");

    const cards =
        Array.from(container.children);


    cards.forEach(other => {

        other.style.pointerEvents = "none";

        if (other !== card) {

            other.dataset.disappearing = "true";

            other.classList.add(
                "disappearing"
            );
        }
    });


    const cardRect =
        card.getBoundingClientRect();

    const containerRect =
        container.getBoundingClientRect();

    const cardCenter =
        cardRect.left +
        cardRect.width / 2;

    const containerCenter =
        containerRect.left +
        containerRect.width / 2;

    const distance =
        containerCenter - cardCenter;


    card.style.transition =
        "transform .8s cubic-bezier(.22,1,.36,1)";

    card.style.transform =
        `translate3d(${distance}px,0,0) scale(1.05)`;


    setTimeout(() => {

        smoothFlip(
            card,
            ability,
            distance
        );

    },820);
}


/* =========================================================
   SMOOTH CARD FLIP
========================================================= */

function smoothFlip(card,ability,distance) {

    card.style.transition = "none";

    card.style.transform =
        `translate3d(${distance}px,0,0) scale(1.05)`;


    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            card.style.transition =
                "transform .42s cubic-bezier(.65,0,.35,1)";

            card.style.transform =
                `translate3d(${distance}px,0,0)
                 scale(1.05)
                 rotateY(90deg)`;


            setTimeout(() => {

                setRevealedCard(
                    card,
                    ability
                );


                requestAnimationFrame(() => {

                    card.style.transition =
                        "transform .42s cubic-bezier(.65,0,.35,1)";

                    card.style.transform =
                        `translate3d(${distance}px,0,0)
                         scale(1.05)
                         rotateY(0deg)`;

                });


                setTimeout(() => {

                    card.classList.add(
                        "showRevealed"
                    );

                },150);


                setTimeout(() => {

                    showSelectedAbility(
                        ability
                    );

                },1050);

            },420);

        });

    });
}


/* =========================================================
   SET REVEALED CARD
========================================================= */

function setRevealedCard(card,ability) {

    const rarityColors = {

        mythic: "#fff4a3",
        legendary: "#ffad66",
        epic: "#c084fc",
        rare: "#60a5fa",
        common: "#bfc3c7"

    };

    const color =
        rarityColors[
            ability.className
        ];


    card.innerHTML = `

        <div
            class="revealedBackground"
            style="--rarity-color:${color};">
        </div>

        <div class="revealedContent">

            <div
                class="revealedIcon"
                style="
                    color:${color};
                    box-shadow:
                        0 0 15px ${color},
                        0 0 30px ${color};
                ">
                ${ability.icon}
            </div>

            <div
                class="cardRarity"
                style="
                    color:${color};
                    text-shadow:
                        0 0 8px ${color},
                        0 0 18px ${color};
                ">
                ${ability.rarity}
            </div>

            <div class="cardName">
                ${ability.name}
            </div>

        </div>
    `;


    card.classList.add(
        ability.className
    );


    card.style.borderColor = color;

    card.style.boxShadow =
        `0 0 8px ${color},
         0 0 20px ${color},
         0 0 40px ${color},
         0 0 75px ${color},
         inset 0 0 30px ${color}`;
}


/* =========================================================
   SHOW ABILITY UNDER CARD
========================================================= */

function showSelectedAbility(ability) {

    const selected =
        document.getElementById(
            "selectedAbility"
        );


    selected.innerHTML = `

        <h3>
            ${ability.name}
        </h3>

        <div
            class="selectedRarity ${ability.className}">
            ${ability.rarity}
        </div>

        <p>
            ${ability.description}
        </p>

        <button
            class="drawAgain"
            onclick="drawAgain()">
            DRAW AGAIN
        </button>

    `;


    selected.style.display = "block";

    selected.classList.remove(
        "abilityVisible"
    );


    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            selected.classList.add(
                "abilityVisible"
            );

        });

    });
}


/* =========================================================
   DRAW AGAIN
========================================================= */

function drawAgain() {
    openTarot();
}


/* =========================================================
   CLOSE TAROT
========================================================= */

function closeTarot() {

    const overlay =
        document.getElementById(
            "tarotOverlay"
        );

    overlay.classList.remove("open");

    setTimeout(() => {

        if (
            !overlay.classList.contains("open")
        ) {

            overlay.style.display = "none";

        }

    },450);
}


/* =========================================================
   INITIALIZE
========================================================= */

updateDisplay();
