<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Respawn Timer</title>

<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    background:#111827;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:15px;

    overflow-x:hidden;
}

button{
    border:none;
    cursor:pointer;
    color:white;

    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
}

button:active{
    transform:scale(.94);
}


/* =====================================================
   MAIN APP
===================================================== */

.container{
    width:100%;
    max-width:430px;

    background:#1f2937;

    padding:25px;

    border-radius:25px;

    text-align:center;

    box-shadow:
        0 0 30px rgba(0,0,0,.7);
}

h1{
    margin:0 0 10px;
}


/* =====================================================
   CIRCULAR TIMER
===================================================== */

.circle{
    width:260px;
    height:260px;

    margin:20px auto;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;

    background:
        conic-gradient(
            #22c55e 360deg,
            #374151 360deg
        );

    transition:
        background .2s linear;
}

.circle::before{
    content:"";

    position:absolute;

    width:210px;
    height:210px;

    border-radius:50%;

    background:#111827;
}

.timer{
    position:relative;
    z-index:2;

    font-size:60px;
    font-weight:bold;
}


/* =====================================================
   START FLASH
===================================================== */

.startFlash{
    animation:startFlash .45s infinite;
}

@keyframes startFlash{

    50%{
        opacity:.25;
    }

}


/* =====================================================
   LARGE START BUTTON
===================================================== */

.startCircle{

    width:150px;
    height:150px;

    border-radius:50%;

    background:#16a34a;

    font-size:30px;
    font-weight:bold;

    box-shadow:
        0 0 25px rgba(22,163,74,.7);
}

.startCircle:active{
    transform:scale(.93);
}


/* =====================================================
   SMALL PAUSE / RESET
===================================================== */

.small{
    font-size:14px;

    padding:8px 14px;

    margin:5px;

    border-radius:10px;
}

.pause{
    background:#eab308;
    color:#111;
}

.reset{
    background:#dc2626;
}


/* =====================================================
   MULTIPLIERS
===================================================== */

.multiplier{
    display:flex;
    justify-content:center;
    gap:10px;
}

.multiplier button{

    width:110px;
    height:60px;

    border-radius:14px;

    background:#2563eb;

    font-size:25px;
    font-weight:bold;
}


/* =====================================================
   CUSTOM TIMER
===================================================== */

input[type="number"]{

    width:100px;

    padding:10px;

    font-size:20px;

    text-align:center;

    border-radius:10px;

    border:none;

    background:white;
    color:#111;
}


/* =====================================================
   TOGGLES
===================================================== */

.toggle{

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:#374151;

    padding:15px;

    margin-top:12px;

    border-radius:12px;
}

.switch{

    width:55px;
    height:28px;

    position:relative;
}

.switch input{
    display:none;
}

.slider{

    position:absolute;
    inset:0;

    background:#6b7280;

    border-radius:20px;

    cursor:pointer;
}

.slider:before{

    content:"";

    position:absolute;

    width:24px;
    height:24px;

    left:2px;
    top:2px;

    background:white;

    border-radius:50%;

    transition:.3s;
}

input:checked + .slider{
    background:#22c55e;
}

input:checked + .slider:before{
    transform:translateX(27px);
}


/* =====================================================
   TAROT BUTTON
===================================================== */

.tarotButton{

    padding:10px 17px;

    margin-top:15px;

    background:#4b5563;

    border-radius:10px;

    font-size:14px;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.tarotButton.tarotButtonPressed{

    animation:
        tarotButtonPress .35s ease;
}

@keyframes tarotButtonPress{

    0%{
        transform:scale(1);
    }

    40%{
        transform:scale(.92);
    }

    70%{
        transform:scale(1.05);
    }

    100%{
        transform:scale(1);
    }

}


/* =====================================================
   TIME UP
===================================================== */

.timeup{

    display:none;

    position:fixed;

    inset:0;

    background:red;

    justify-content:center;
    align-items:center;

    font-size:70px;
    font-weight:bold;

    z-index:200;

    text-align:center;
}

.flash{
    animation:flash .5s infinite;
}

@keyframes flash{

    50%{
        background:white;
    }

}


/* =====================================================
   TAROT OVERLAY
===================================================== */

.tarotOverlay{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.93);

    z-index:100;

    justify-content:center;
    align-items:center;

    padding:15px;

    opacity:0;

    transform:scale(.96);

    transition:
        opacity .3s ease,
        transform .3s ease;
}

.tarotOverlay.tarotOpen{

    opacity:1;

    transform:scale(1);
}


/* =====================================================
   TAROT WINDOW
===================================================== */

.tarotMenu{

    width:100%;

    max-width:900px;

    max-height:90vh;

    overflow-y:auto;

    background:#1f2937;

    border-radius:20px;

    padding:25px;

    text-align:center;

    position:relative;

    box-shadow:
        0 0 40px rgba(0,0,0,.8);

    opacity:0;

    transform:
        translateY(20px)
        scale(.95);

    transition:
        opacity .4s ease .05s,
        transform .4s cubic-bezier(.2,.8,.2,1) .05s;
}

.tarotOverlay.tarotOpen .tarotMenu{

    opacity:1;

    transform:
        translateY(0)
        scale(1);
}


.tarotMenu h2{

    margin:5px 0;

    font-size:30px;
}

.tarotSubtitle{

    color:#9ca3af;

    margin-top:5px;
}

.closeTarot{

    position:absolute;

    right:12px;
    top:12px;

    width:40px;
    height:40px;

    padding:0;

    margin:0;

    border-radius:50%;

    background:#374151;

    font-size:18px;
}


/* =====================================================
   TAROT CARDS
===================================================== */

.tarotCards{

    display:flex;

    justify-content:center;

    gap:20px;

    margin-top:25px;
}


/* =====================================================
   CARD ENTRY ANIMATION
===================================================== */

.tarotOverlay.tarotOpen .tarotCard{

    opacity:0;

    transform:
        translateY(45px)
        scale(.9);
}


.tarotOverlay.tarotOpen .tarotCard:nth-child(1){

    animation:
        tarotCardEnter
        .5s
        cubic-bezier(.2,.8,.2,1)
        .15s
        forwards;
}


.tarotOverlay.tarotOpen .tarotCard:nth-child(2){

    animation:
        tarotCardEnter
        .5s
        cubic-bezier(.2,.8,.2,1)
        .25s
        forwards;
}


.tarotOverlay.tarotOpen .tarotCard:nth-child(3){

    animation:
        tarotCardEnter
        .5s
        cubic-bezier(.2,.8,.2,1)
        .35s
        forwards;
}


@keyframes tarotCardEnter{

    0%{

        opacity:0;

        transform:
            translateY(45px)
            scale(.9);
    }

    70%{

        opacity:1;

        transform:
            translateY(-5px)
            scale(1.03);
    }

    100%{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =====================================================
   CARD DESIGN
===================================================== */

.tarotCard{

    width:220px;
    height:330px;

    border-radius:18px;

    padding:15px;

    cursor:pointer;

    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #374151,
            #111827
        );

    border:3px solid rgba(255,255,255,.35);

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    color:white;

    box-shadow:
        0 0 12px rgba(255,255,255,.2);

    transition:
        transform .45s ease,
        box-shadow 2.5s ease,
        border-color 2.5s ease;

    touch-action:manipulation;
}


.tarotCard::before{

    content:"✦";

    position:absolute;

    font-size:120px;

    color:rgba(255,255,255,.06);
}


.tarotCard::after{

    content:"🃏";

    position:absolute;

    font-size:70px;

    opacity:.8;
}


.tarotCard:hover{

    transform:
        translateY(-6px)
        scale(1.02);
}


/* =====================================================
   CARD PICK ANIMATION
===================================================== */

.tarotCard.picking{

    animation:
        tarotPick .65s ease forwards;
}

@keyframes tarotPick{

    0%{
        transform:scale(1);
    }

    25%{
        transform:
            scale(1.08)
            rotate(-2deg);
    }

    50%{
        transform:
            scale(1.12)
            rotate(2deg);
    }

    75%{
        transform:
            scale(1.06)
            rotate(-1deg);
    }

    100%{
        transform:scale(1);
    }

}


.tarotCard.picking::before{

    animation:
        cardShine .65s ease;
}

@keyframes cardShine{

    0%{
        opacity:.05;
        transform:scale(.8);
    }

    50%{
        opacity:.5;
        transform:scale(1.4);
    }

    100%{
        opacity:.06;
        transform:scale(1);
    }

}


/* =====================================================
   SELECTED CARD
===================================================== */

.tarotCard.selected{

    animation:none;

    transition:
        box-shadow .8s ease,
        border-color .8s ease,
        transform .4s ease;
}


/* =====================================================
   RARITY GLOWS
===================================================== */

.tarotCard.selected.mythic{

    border-color:#fff4a3;

    box-shadow:
        0 0 12px #fff4a3,
        0 0 28px #fff4a3,
        0 0 45px rgba(255,244,163,.55);
}


.tarotCard.selected.legendary{

    border-color:#ffad66;

    box-shadow:
        0 0 12px #ffad66,
        0 0 28px #ffad66,
        0 0 45px rgba(255,173,102,.55);
}


.tarotCard.selected.epic{

    border-color:#c084fc;

    box-shadow:
        0 0 12px #c084fc,
        0 0 28px #c084fc,
        0 0 45px rgba(192,132,252,.55);
}


.tarotCard.selected.rare{

    border-color:#60a5fa;

    box-shadow:
        0 0 12px #60a5fa,
        0 0 28px #60a5fa,
        0 0 45px rgba(96,165,250,.55);
}


.tarotCard.selected.common{

    border-color:#bfc3c7;

    box-shadow:
        0 0 10px #bfc3c7,
        0 0 25px #bfc3c7,
        0 0 40px rgba(191,195,199,.5);
}


/* =====================================================
   CARD REVEAL
===================================================== */

.tarotCard.selected .cardBack{

    animation:
        cardReveal .45s ease;
}

@keyframes cardReveal{

    0%{

        opacity:0;

        transform:scale(.85);
    }

    100%{

        opacity:1;

        transform:scale(1);
    }

}


/* =====================================================
   CARD CONTENT
===================================================== */

.cardBack{

    position:relative;

    z-index:2;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;
}

.cardBackIcon{

    font-size:70px;

    margin-bottom:15px;
}

.cardBackText{

    font-size:18px;

    font-weight:bold;

    letter-spacing:2px;
}

.cardBackSubtext{

    margin-top:8px;

    font-size:12px;

    color:#9ca3af;
}

.cardRarity{

    font-size:16px;

    font-weight:bold;

    text-transform:uppercase;

    letter-spacing:2px;

    margin-bottom:12px;
}

.cardName{

    font-size:22px;

    font-weight:bold;

    text-align:center;
}


/* =====================================================
   SELECTED ABILITY
===================================================== */

.selectedAbility{

    display:none;

    margin-top:25px;

    padding:20px;

    border-radius:15px;

    background:#111827;

    text-align:left;
}

.selectedAbility h3{

    margin-top:0;

    font-size:26px;
}

.selectedRarity{

    display:inline-block;

    padding:6px 10px;

    border-radius:8px;

    color:#111827;

    font-weight:bold;

    margin-bottom:10px;
}

.selectedRarity.mythic{
    background:#fff4a3;
}

.selectedRarity.legendary{
    background:#ffad66;
}

.selectedRarity.epic{
    background:#c084fc;
}

.selectedRarity.rare{
    background:#60a5fa;
}

.selectedRarity.common{
    background:#bfc3c7;
}

.drawAgain{

    display:block;

    margin:20px auto 0;

    background:#2563eb;

    padding:12px 18px;

    border-radius:12px;

    font-size:16px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .tarotCards{
        gap:12px;
    }

    .tarotCard{
        width:30%;
        height:250px;
    }

    .cardBackIcon{
        font-size:50px;
    }

    .cardBackText{
        font-size:13px;
    }

}


@media(max-width:500px){

    body{
        padding:10px;
    }

    .container{
        padding:20px 15px;
    }

    .tarotMenu{
        padding:18px 10px;
    }

    .tarotCards{
        gap:8px;
    }

    .tarotCard{
        width:31%;
        height:220px;
        padding:8px;
    }

    .cardBackIcon{
        font-size:42px;
    }

    .cardBackText{
        font-size:11px;
    }

    .cardBackSubtext{
        font-size:9px;
    }

}


@media(max-width:400px){

    .circle{

        width:220px;
        height:220px;
    }

    .circle::before{

        width:175px;
        height:175px;
    }

    .timer{
        font-size:48px;
    }

    .startCircle{

        width:130px;
        height:130px;

        font-size:26px;
    }

    .multiplier button{

        width:95px;
        height:55px;
    }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        transition-duration:.01ms !important;

    }

}

</style>
</head>

<body>


<!-- =====================================================
     MAIN TIMER
===================================================== -->

<div class="container">

    <h1>Respawn Timer</h1>


    <!-- CIRCULAR TIMER -->

    <div
        class="circle"
        id="circle"
    >

        <div
            id="display"
            class="timer"
        >
            00:30
        </div>

    </div>


    <!-- START -->

    <button
        class="startCircle"
        onclick="startTimer()"
    >
        START
    </button>

    <br>


    <!-- PAUSE / RESET -->

    <button
        class="pause small"
        onclick="pauseTimer()"
    >
        ⏸
    </button>

    <button
        class="reset small"
        onclick="resetTimer()"
    >
        ↻
    </button>


    <!-- CUSTOM TIMER -->

    <h3>Timer Duration</h3>

    <button
        class="small"
        onclick="changeTime(-5)"
    >
        -5
    </button>

    <input
        id="customTime"
        type="number"
        value="30"
        min="0"
    >

    <button
        class="small"
        onclick="changeTime(5)"
    >
        +5
    </button>


    <!-- MULTIPLIERS -->

    <h3>Multiplier</h3>

    <div class="multiplier">

        <button
            onclick="multiStart(2)"
        >
            2X
        </button>

        <button
            onclick="multiStart(3)"
        >
            3X
        </button>

    </div>


    <!-- FIVE OF TIME -->

    <div class="toggle">

        <span>
            Five of Time
        </span>

        <label class="switch">

            <input
                id="fiveTime"
                type="checkbox"
            >

            <span class="slider"></span>

        </label>

    </div>


    <!-- NO RESPAWN -->

    <div class="toggle">

        <span>
            No Respawn Time
        </span>

        <label class="switch">

            <input
                id="noRespawn"
                type="checkbox"
            >

            <span class="slider"></span>

        </label>

    </div>


    <!-- TAROT -->

    <button
        class="tarotButton"
        onclick="openTarot()"
    >
        🃏 TAROT CARDS
    </button>

</div>


<!-- =====================================================
     TIME UP
===================================================== -->

<div
    id="timeup"
    class="timeup"
>
    TIME UP
</div>


<!-- =====================================================
     TAROT OVERLAY
===================================================== -->

<div
    id="tarotOverlay"
    class="tarotOverlay"
>

    <div class="tarotMenu">

        <button
            class="closeTarot"
            onclick="closeTarot()"
        >
            ✕
        </button>


        <h2>
            🃏 Tarot Cards
        </h2>


        <p class="tarotSubtitle">
            Choose ONE card
        </p>


        <div
            id="tarotCards"
            class="tarotCards"
        ></div>


        <div
            id="selectedAbility"
            class="selectedAbility"
        ></div>

    </div>

</div>


<script>

/* =====================================================
   TIMER
===================================================== */

let timer = null;

let seconds = 30;

let totalSeconds = 30;

let running = false;

let fiveValue = 0;


/* =====================================================
   AUDIO
===================================================== */

let audioContext = null;


function enableAudio(){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }

    }
    catch(error){

        console.log(
            "Audio unavailable:",
            error
        );

    }

}


/* =====================================================
   ELEMENTS
===================================================== */

const display =
    document.getElementById(
        "display"
    );

const circle =
    document.getElementById(
        "circle"
    );

const noRespawnToggle =
    document.getElementById(
        "noRespawn"
    );

const fiveTimeToggle =
    document.getElementById(
        "fiveTime"
    );

const customTime =
    document.getElementById(
        "customTime"
    );


/* =====================================================
   DISPLAY
===================================================== */

function updateDisplay(){

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        seconds % 60;


    display.innerHTML =
        `${String(minutes).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;


    let percent = 0;


    if(totalSeconds > 0){

        percent =
            Math.max(
                0,
                Math.min(
                    1,
                    seconds / totalSeconds
                )
            );

    }


    circle.style.background =
        `conic-gradient(
            #22c55e
            ${percent * 360}deg,
            #374151
            ${percent * 360}deg
        )`;

}


/* =====================================================
   START
===================================================== */

function startTimer(){

    enableAudio();


    if(running){

        return;

    }


    /*
       Five of Time:
       0 → 5 → 10 → ... → 60 → 0
    */

    if(fiveTimeToggle.checked){

        fiveValue += 5;


        if(fiveValue > 60){

            fiveValue = 0;

        }


        seconds =
            fiveValue;

    }


    totalSeconds =
        seconds;


    if(seconds <= 0){

        updateDisplay();

        return;

    }


    updateDisplay();


    running = true;


    /*
       Flash for first 3 seconds.
    */

    display.classList.add(
        "startFlash"
    );


    setTimeout(
        function(){

            display.classList.remove(
                "startFlash"
            );

        },
        3000
    );


    timer =
        setInterval(
            function(){

                seconds--;

                updateDisplay();


                if(seconds <= 0){

                    finishTimer();

                }

            },
            1000
        );

}


/* =====================================================
   2X / 3X
===================================================== */

function multiStart(multiplier){

    enableAudio();


    clearInterval(timer);

    timer = null;

    running = false;


    fiveTimeToggle.checked =
        false;


    if(multiplier === 2){

        seconds = 60;

    }


    if(multiplier === 3){

        seconds = 90;

    }


    totalSeconds =
        seconds;


    customTime.value =
        seconds;


    updateDisplay();


    startTimer();

}


/* =====================================================
   NO RESPAWN
===================================================== */

noRespawnToggle.addEventListener(
    "change",
    function(){

        if(this.checked){

            enableAudio();


            clearInterval(timer);

            timer = null;

            running = false;


            seconds = 45;

            totalSeconds = 45;


            customTime.value = 45;


            updateDisplay();


            /*
               Start immediately.
            */

            startTimer();

        }

    }
);


/* =====================================================
   PAUSE
===================================================== */

function pauseTimer(){

    clearInterval(timer);

    timer = null;

    running = false;

}


/* =====================================================
   RESET
===================================================== */

function resetTimer(){

    clearInterval(timer);

    timer = null;

    running = false;


    seconds = 30;

    totalSeconds = 30;

    fiveValue = 0;


    customTime.value = 30;


    noRespawnToggle.checked =
        false;


    updateDisplay();

}


/* =====================================================
   CHANGE TIME
===================================================== */

function changeTime(amount){

    clearInterval(timer);

    timer = null;

    running = false;


    let value =
        parseInt(
            customTime.value
        ) || 0;


    value += amount;


    if(value < 0){

        value = 0;

    }


    customTime.value =
        value;


    seconds =
        value;

    totalSeconds =
        value;


    updateDisplay();

}


customTime.addEventListener(
    "change",
    function(){

        clearInterval(timer);

        timer = null;

        running = false;


        let value =
            parseInt(
                this.value
            ) || 0;


        if(value < 0){

            value = 0;

        }


        this.value =
            value;


        seconds =
            value;

        totalSeconds =
            value;


        updateDisplay();

    }
);


/* =====================================================
   TIMER FINISH
===================================================== */

function finishTimer(){

    clearInterval(timer);

    timer = null;

    running = false;


    seconds = 0;


    updateDisplay();


    document.body.classList.add(
        "flash"
    );


    document.getElementById(
        "timeup"
    ).style.display =
        "flex";


    /*
       No Respawn uses 3 beeps.
    */

    if(noRespawnToggle.checked){

        threeBeeps();


        noRespawnToggle.checked =
            false;

    }

    else{

        normalBeep();

    }


    /*
       Alert lasts only 3 seconds.
    */

    setTimeout(
        function(){

            document.getElementById(
                "timeup"
            ).style.display =
                "none";


            document.body.classList.remove(
                "flash"
            );


            /*
               Return to default 30 seconds.
            */

            seconds = 30;

            totalSeconds = 30;

            fiveValue = 0;

            customTime.value = 30;


            updateDisplay();

        },
        3000
    );

}


/* =====================================================
   NORMAL SOUND
===================================================== */

function normalBeep(){

    enableAudio();


    if(!audioContext){

        return;

    }


    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    osc.type =
        "sine";

    osc.frequency.value =
        700;


    osc.connect(gain);

    gain.connect(
        audioContext.destination
    );


    const now =
        audioContext.currentTime;


    gain.gain.setValueAtTime(
        .25,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        .01,
        now + 1.5
    );


    osc.start(now);

    osc.stop(
        now + 1.5
    );

}


/* =====================================================
   THREE BEEPS
===================================================== */

function threeBeeps(){

    enableAudio();


    if(!audioContext){

        return;

    }


    for(
        let i = 0;
        i < 3;
        i++
    ){

        const osc =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        const start =
            audioContext.currentTime
            + (i * .7);


        osc.type =
            "square";

        osc.frequency.value =
            900;


        osc.connect(gain);

        gain.connect(
            audioContext.destination
        );


        gain.gain.setValueAtTime(
            .3,
            start
        );


        gain.gain.setValueAtTime(
            0,
            start + .25
        );


        osc.start(start);

        osc.stop(
            start + .3
        );

    }

}


/* =====================================================
   TAROT ABILITIES
===================================================== */

const tarotAbilities = [

    {
        name:"The Human Shield",

        rarity:"Mythic",

        className:"mythic",

        description:
        "This ability allows the user to drop their weapon and no longer be able to deal or take ANY damage. This also means they are not allowed to damage environmental objects unless it is impossible to avoid. The user also cannot stand too close to enemy players. This ability ends if your teammate is killed or you decide for it to end.",

        weight:1
    },

    {
        name:"Swapper",

        rarity:"Legendary",

        className:"legendary",

        description:
        "This ability can only be used once and allows you to switch weapons with the opponent after hitting them.",

        weight:5
    },

    {
        name:"Endless Mag",

        rarity:"Epic",

        className:"epic",

        description:
        "Upgrades your weapon's magazine, if it can accept one, to the highest possible magazine capacity.",

        weight:14
    },

    {
        name:"Shields Up",

        rarity:"Rare",

        className:"rare",

        description:
        "1 shield is granted until death. This can only be used once. This can also be traded for a small ammo crate if you already have a shield.",

        weight:25
    },

    {
        name:"+1 Instant Respawn",

        rarity:"Common",

        className:"common",

        description:
        "One player on your team may instantly respawn once after reaching the respawn area, with no wait time. This is a single-use ability and applies to one player of your choice.",

        weight:55
    }

];


/* =====================================================
   RANDOM RARITY
===================================================== */

function getRandomAbility(){

    const totalWeight =
        tarotAbilities.reduce(
            function(sum,ability){

                return sum +
                    ability.weight;

            },
            0
        );


    let random =
        Math.random()
        * totalWeight;


    for(
        const ability
        of tarotAbilities
    ){

        random -=
            ability.weight;


        if(random <= 0){

            return ability;

        }

    }


    return tarotAbilities[
        tarotAbilities.length - 1
    ];

}


/* =====================================================
   TAROT GLOW COLOURS
===================================================== */

const tarotGlowColors = [

    "#ff6b81",
    "#ff9f43",
    "#ffd166",
    "#4dd4ac",
    "#4dabf7",
    "#748ffc",
    "#b197fc",
    "#f783ac",
    "#ffffff"

];


function randomTarotColor(){

    return tarotGlowColors[
        Math.floor(
            Math.random()
            * tarotGlowColors.length
        )
    ];

}


/* =====================================================
   SLOW RANDOM TAROT GLOW
===================================================== */

function animateTarotGlow(card){

    if(
        card.classList.contains("selected") ||
        card.classList.contains("picking")
    ){

        return;

    }


    const color =
        randomTarotColor();


    card.style.borderColor =
        color;


    card.style.boxShadow = `

        0 0 8px ${color},

        0 0 18px ${color},

        0 0 32px rgba(255,255,255,.12)

    `;


    /*
       Slow colour transition.
    */

    setTimeout(
        function(){

            animateTarotGlow(card);

        },
        2500 +
        Math.random() * 1500
    );

}


/* =====================================================
   OPEN TAROT
===================================================== */

function openTarot(){

    const overlay =
        document.getElementById(
            "tarotOverlay"
        );

    const cardContainer =
        document.getElementById(
            "tarotCards"
        );

    const selected =
        document.getElementById(
            "selectedAbility"
        );

    const tarotButton =
        document.querySelector(
            ".tarotButton"
        );


    /*
       Button press animation.
    */

    tarotButton.classList.remove(
        "tarotButtonPressed"
    );

    void tarotButton.offsetWidth;

    tarotButton.classList.add(
        "tarotButtonPressed"
    );


    /*
       Reset previous selection.
    */

    selected.style.display =
        "none";

    selected.innerHTML =
        "";

    cardContainer.innerHTML =
        "";


    /*
       Make three cards.
    */

    for(
        let i = 0;
        i < 3;
        i++
    ){

        const ability =
            getRandomAbility();


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "tarotCard";


        card.tarotAbility =
            ability;


        /*
           All cards look exactly
           the same before selection.
        */

        card.innerHTML = `

            <div class="cardBack">

                <div class="cardBackIcon">
                    🃏
                </div>

                <div class="cardBackText">
                    TAROT
                </div>

                <div class="cardBackSubtext">
                    CHOOSE ME
                </div>

            </div>

        `;


        card.addEventListener(
            "click",
            function(){

                selectTarotCard(
                    ability,
                    card
                );

            }
        );


        cardContainer.appendChild(
            card
        );


        /*
           Start slow random glow.
        */

        animateTarotGlow(card);

    }


    /*
       Show overlay.
    */

    overlay.style.display =
        "flex";


    /*
       Start opening animation
       on next browser frame.
    */

    requestAnimationFrame(
        function(){

            requestAnimationFrame(
                function(){

                    overlay.classList.add(
                        "tarotOpen"
                    );

                }
            );

        }
    );

}


/* =====================================================
   SELECT TAROT CARD
===================================================== */

function selectTarotCard(
    ability,
    selectedCard
){

    /*
       Prevent double selection.
    */

    if(
        selectedCard.classList.contains(
            "selected"
        ) ||
        selectedCard.classList.contains(
            "picking"
        )
    ){

        return;

    }


    /*
       Stop random glow.
    */

    selectedCard.classList.add(
        "picking"
    );


    const cardContainer =
        document.getElementById(
            "tarotCards"
        );


    /*
       Selection animation.
    */

    setTimeout(
        function(){

            selectedCard.classList.remove(
                "picking"
            );

            selectedCard.classList.add(
                "selected"
            );


            /*
               Apply actual rarity glow.
            */

            selectedCard.classList.add(
                ability.className
            );


            /*
               Remove random glow.
            */

            selectedCard.style.borderColor =
                "";

            selectedCard.style.boxShadow =
                "";


            /*
               Remove unselected cards.
            */

            const cards =
                Array.from(
                    cardContainer.children
                );


            cards.forEach(
                function(card){

                    if(card !== selectedCard){

                        card.remove();

                    }

                }
            );


            /*
               Reveal card.
            */

            selectedCard.innerHTML = `

                <div class="cardBack">

                    <div class="cardBackIcon">
                        🃏
                    </div>

                    <div class="cardRarity">
                        ${ability.rarity}
                    </div>

                    <div class="cardName">
                        ${ability.name}
                    </div>

                </div>

            `;


            /*
               Full ability description.
            */

            const selected =
                document.getElementById(
                    "selectedAbility"
                );


            selected.innerHTML = `

                <h3>
                    ${ability.name}
                </h3>

                <div
                    class="selectedRarity ${ability.className}"
                >
                    ${ability.rarity}
                </div>

                <p>
                    ${ability.description}
                </p>

                <button
                    class="drawAgain"
                    onclick="drawAgain()"
                >
                    DRAW AGAIN
                </button>

            `;


            selected.style.display =
                "block";

        },
        650
    );

}


/* =====================================================
   DRAW AGAIN
===================================================== */

function drawAgain(){

    openTarot();

}


/* =====================================================
   CLOSE TAROT
===================================================== */

function closeTarot(){

    const overlay =
        document.getElementById(
            "tarotOverlay"
        );


    overlay.classList.remove(
        "tarotOpen"
    );


    /*
       Wait for closing animation.
    */

    setTimeout(
        function(){

            if(
                !overlay.classList.contains(
                    "tarotOpen"
                )
            ){

                overlay.style.display =
                    "none";

            }

        },
        300
    );

}


/* =====================================================
   INITIALIZE
===================================================== */

updateDisplay();

</script>
